<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Long-term Stock Research</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    color: #1a1a1a;
    background: #fafaf7;
    line-height: 1.5;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  .header {
    margin-bottom: 20px;
  }

  .header h1 {
    font-size: 24px;
    font-weight: 500;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .header p {
    font-size: 14px;
    color: #6b6b6b;
    margin: 0;
  }

  .disclaimer {
    background: #faeeda;
    color: #633806;
    border: 0.5px solid rgba(133, 79, 11, 0.2);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 18px;
    line-height: 1.55;
  }

  .panel {
    background: white;
    border: 0.5px solid rgba(0,0,0,0.12);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }

  .panel h2 {
    font-size: 16px;
    font-weight: 500;
    margin: 0 0 14px;
  }

  .controls {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 12px;
    margin-bottom: 12px;
  }

  .control label {
    display: block;
    font-size: 12px;
    color: #6b6b6b;
    margin-bottom: 4px;
  }

  .control select,
  .control input {
    width: 100%;
    padding: 8px 10px;
    font-size: 14px;
    border: 0.5px solid rgba(0,0,0,0.18);
    border-radius: 8px;
    background: white;
    font-family: inherit;
  }

  .control select:focus,
  .control input:focus {
    outline: none;
    border-color: #1a1a1a;
    box-shadow: 0 0 0 2px rgba(26,26,26,0.08);
  }

  button {
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 500;
    border: 0.5px solid rgba(0,0,0,0.18);
    border-radius: 8px;
    background: white;
    cursor: pointer;
  }

  button.primary {
    background: #1a1a1a;
    color: white;
  }

  button:hover:not(:disabled) {
    background: #f1efe8;
  }

  button.primary:hover:not(:disabled) {
    background: #333;
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .status {
    font-size: 13px;
    color: #6b6b6b;
  }

  .error {
    color: #b42318;
  }

  .success {
    color: #027a48;
  }

  .small {
    font-size: 12px;
    color: #888;
  }

  .api-key-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
  }

  .api-key-row input {
    flex: 1;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
    gap: 10px;
  }

  .stock-card {
    background: white;
    border: 0.5px solid rgba(0,0,0,0.12);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .stock-card .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .ticker {
    font-size: 17px;
    font-weight: 600;
  }

  .company {
    font-size: 13px;
    color: #6b6b6b;
  }

  .rank {
    font-size: 11px;
    color: #999;
  }

  .badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .badge {
    font-size: 11px;
    padding: 2px 9px;
    background: #f1efe8;
    border-radius: 12px;
  }

  .metrics {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 6px;
  }

  .metrics .cell {
    font-size: 12px;
  }

  .metrics .lbl {
    color: #888;
    font-size: 11px;
    display: block;
  }

  .rationale {
    font-size: 13px;
    line-height: 1.55;
  }

  .risk {
    font-size: 12px;
    color: #6b6b6b;
    border-top: 0.5px solid rgba(0,0,0,0.08);
    padding-top: 6px;
  }

  .actions {
    margin-top: 4px;
    display: flex;
    gap: 6px;
  }

  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid #ddd;
    border-top-color: #111;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 6px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .market-summary {
    background: #f1efe8;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 14px;
  }

  .empty {
    color: #888;
    font-size: 13px;
  }

  .history-item {
    padding: 10px 0;
    border-bottom: 0.5px solid rgba(0,0,0,0.08);
    cursor: pointer;
  }

  .history-item:hover {
    background: #f8f8f5;
  }

</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Long-term stock research</h1>
    <p>Daily candidate screener — powered by Gemini + Google Search</p>
  </div>

  <div class="disclaimer">
    <strong>Not investment advice.</strong>
    Research candidates only. Verify independently before investing.
  </div>

  <div class="panel">

    <h2>Your preferences</h2>

    <div class="api-key-row">
      <input
        type="password"
        id="api-key-input"
        placeholder="Gemini API key from Google AI Studio"
      />

      <button id="save-key">Save key</button>

      <span id="api-status" class="small"></span>
    </div>

    <div class="controls">

      <div class="control">
        <label>Investment style</label>
        <select id="style">
          <option value="balanced">Balanced</option>
          <option value="value">Value</option>
          <option value="growth">Growth</option>
          <option value="dividend">Dividend</option>
          <option value="defensive">Defensive</option>
          <option value="garp">GARP</option>
        </select>
      </div>

      <div class="control">
        <label>Risk tolerance</label>
        <select id="risk">
          <option value="moderate">Moderate</option>
          <option value="conservative">Conservative</option>
          <option value="aggressive">Aggressive</option>
        </select>
      </div>

      <div class="control">
        <label>Market cap</label>
        <select id="cap">
          <option value="mixed">Mixed</option>
          <option value="large">Large cap</option>
          <option value="mid">Mid cap</option>
          <option value="any">Any</option>
        </select>
      </div>

      <div class="control">
        <label>Geography</label>
        <select id="geo">
          <option value="us">US</option>
          <option value="us-and-intl">US + international</option>
          <option value="global">Global</option>
        </select>
      </div>

    </div>

    <div class="control" style="margin-bottom:14px;">
      <label>Sector preferences</label>
      <input
        id="sectors"
        placeholder="e.g. emphasize healthcare, avoid crypto"
      />
    </div>

    <div class="toolbar">
      <button class="primary" id="generate-btn">
        Generate 20 picks
      </button>

      <span id="status" class="status"></span>
    </div>

  </div>

  <div id="results"></div>

  <div class="panel">
    <h2>Watchlist</h2>
    <div id="watchlist">
      <div class="empty">No saved stocks yet.</div>
    </div>
  </div>

  <div class="panel">
    <h2>Recent generations</h2>
    <div id="history">
      <div class="empty">No generations yet.</div>
    </div>
  </div>

</div>

<script>

const $ = (id) => document.getElementById(id);

const STORAGE = {
  prefs: 'stock-prefs-v1',
  watchlist: 'stock-watchlist-v1',
  history: 'stock-history-v1',
  apiKey: 'gemini-api-key'
};

function esc(s) {
  return String(s ?? '')
    .replace(/[&<>"']/g, m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m]));
}

async function safeGet(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}

async function safeSet(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

function getApiKey() {
  return localStorage.getItem(STORAGE.apiKey) || '';
}

async function validateApiKey(key) {
  try {
    const r = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`
    );
    return r.ok;
  } catch {
    return false;
  }
}

async function fetchWithTimeout(url, options, timeout = 90000) {
  const controller = new AbortController();

  const id = setTimeout(() => controller.abort(), timeout);

  try {
    return await fetch(url, {
      ...options,
      signal: controller.signal
    });
  } finally {
    clearTimeout(id);
  }
}

async function callGemini(systemPrompt, userPrompt, maxTokens = 8000) {

  const response = await fetchWithTimeout(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(getApiKey())}`,
    {
      method: 'POST',

      headers: {
        'Content-Type': 'application/json'
      },

      body: JSON.stringify({

        system_instruction: {
          parts: [{ text: systemPrompt }]
        },

        contents: [{
          role: 'user',
          parts: [{ text: userPrompt }]
        }],

        tools: [
          {
            google_search: {}
          }
        ],

        generationConfig: {
          responseMimeType: 'application/json',
          temperature: 0.4,
          maxOutputTokens: maxTokens
        }

      })
    }
  );

  if (!response.ok) {
    const err = await response.text();
    throw new Error(err.slice(0, 300));
  }

  const data = await response.json();

  const text =
    data.candidates?.[0]?.content?.parts
      ?.map(p => p.text || '')
      .join('') || '';

  return JSON.parse(text);
}

function validatePicks(data) {
  return (
    data &&
    Array.isArray(data.picks)
  );
}

function dedupePicks(picks) {
  return picks.filter(
    (p, i, arr) =>
      arr.findIndex(x => x.ticker === p.ticker) === i
  );
}

function renderCard(stock, i) {

  return `
    <div class="stock-card">

      <div class="top">
        <div>
          <div class="ticker">${esc(stock.ticker)}</div>
          <div class="company">${esc(stock.company)}</div>
        </div>

        <div class="rank">#${i + 1}</div>
      </div>

      <div class="badges">
        <span class="badge">${esc(stock.sector || 'Unknown')}</span>
        <span class="badge">${esc(stock.category || 'Research')}</span>
      </div>

      <div class="metrics">

        <div class="cell">
          <span class="lbl">Price</span>
          ${esc(stock.currentPrice || 'N/A')}
        </div>

        <div class="cell">
          <span class="lbl">P/E</span>
          ${esc(stock.peRatio || 'N/A')}
        </div>

        <div class="cell">
          <span class="lbl">Market cap</span>
          ${esc(stock.marketCap || 'N/A')}
        </div>

      </div>

      <div class="rationale">
        ${esc(stock.rationale || '')}
      </div>

      <div class="risk">
        <strong>Risks:</strong>
        ${esc(stock.risks || 'N/A')}
      </div>

      <div class="actions">
        <button onclick="saveStock('${esc(stock.ticker)}')">
          Save
        </button>
      </div>

    </div>
  `;
}

function renderResults(data) {

  const results = $('results');

  results.innerHTML = `
    <div class="panel">

      <h2>
        Top ${data.picks.length} candidates
      </h2>

      <div class="market-summary">
        ${esc(data.marketSummary || '')}
      </div>

      <div class="grid">
        ${data.picks.map(renderCard).join('')}
      </div>

    </div>
  `;

  window.latestResults = data;
}

async function renderWatchlist() {

  const watchlist = await safeGet(STORAGE.watchlist) || [];

  if (!watchlist.length) {
    $('watchlist').innerHTML =
      '<div class="empty">No saved stocks yet.</div>';
    return;
  }

  $('watchlist').innerHTML = `
    <div class="grid">
      ${watchlist.map(renderCard).join('')}
    </div>
  `;
}

async function renderHistory() {

  const history = await safeGet(STORAGE.history) || [];

  if (!history.length) {
    $('history').innerHTML =
      '<div class="empty">No generations yet.</div>';
    return;
  }

  $('history').innerHTML = history.map((h, i) => `
    <div class="history-item" onclick="loadHistory(${i})">
      ${new Date(h.generatedAt).toLocaleString()}
    </div>
  `).join('');
}

async function saveStock(ticker) {

  const latest = window.latestResults;

  if (!latest) return;

  const stock = latest.picks.find(
    p => p.ticker === ticker
  );

  if (!stock) return;

  const watchlist =
    await safeGet(STORAGE.watchlist) || [];

  if (watchlist.find(x => x.ticker === ticker)) {
    return;
  }

  watchlist.unshift(stock);

  await safeSet(STORAGE.watchlist, watchlist);

  renderWatchlist();
}

async function loadHistory(index) {

  const history =
    await safeGet(STORAGE.history) || [];

  const item = history[index];

  if (item) {
    renderResults(item);
    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });
  }
}

async function generateStocks() {

  const btn = $('generate-btn');
  const status = $('status');

  const apiKey = getApiKey();

  if (!apiKey) {
    status.innerHTML =
      '<span class="error">Enter API key first.</span>';
    return;
  }

  btn.disabled = true;

  status.innerHTML =
    '<span class="spinner"></span>Analyzing markets...';

  try {

    const prefs = {
      style: $('style').value,
      risk: $('risk').value,
      cap: $('cap').value,
      geo: $('geo').value,
      sectors: $('sectors').value
    };

    await safeSet(STORAGE.prefs, prefs);

    const systemPrompt = `
You are a financial research assistant.

Return ONLY valid JSON.

Schema:

{
  "marketSummary": "string",
  "picks": [
    {
      "ticker": "string",
      "company": "string",
      "sector": "string",
      "marketCap": "string",
      "peRatio": "string",
      "dividendYield": "string",
      "currentPrice": "string",
      "rationale": "string",
      "risks": "string",
      "category": "value | growth | dividend | defensive"
    }
  ]
}

Rules:
- Exactly 20 picks
- Maximum 3 picks per sector
- Use current web data
- Use N/A if uncertain
- No hallucinated numbers
`;

    const userPrompt = `
Generate 20 long-term stock research candidates.

Preferences:

Investment style: ${prefs.style}
Risk tolerance: ${prefs.risk}
Market cap: ${prefs.cap}
Geography: ${prefs.geo}
Sector notes: ${prefs.sectors || 'None'}

Today is ${new Date().toISOString().slice(0,10)}.
`;

    const result = await callGemini(
      systemPrompt,
      userPrompt
    );

    if (!validatePicks(result)) {
      throw new Error('Invalid response schema');
    }

    result.picks = dedupePicks(result.picks);

    result.generatedAt = new Date().toISOString();

    renderResults(result);

    const history =
      await safeGet(STORAGE.history) || [];

    history.unshift(result);

    await safeSet(
      STORAGE.history,
      history.slice(0, 20)
    );

    renderHistory();

    status.innerHTML =
      '<span class="success">Generated successfully.</span>';

  } catch (err) {

    console.error(err);

    status.innerHTML = `
      <span class="error">
        ${esc(err.message || 'Unknown error')}
      </span>
    `;

  } finally {
    btn.disabled = false;
  }
}

async function loadPrefs() {

  const prefs =
    await safeGet(STORAGE.prefs);

  if (!prefs) return;

  $('style').value = prefs.style || 'balanced';
  $('risk').value = prefs.risk || 'moderate';
  $('cap').value = prefs.cap || 'mixed';
  $('geo').value = prefs.geo || 'us';
  $('sectors').value = prefs.sectors || '';
}

async function initApiKey() {

  const existing = getApiKey();

  if (existing) {
    $('api-key-input').value = existing;
    $('api-status').textContent = 'Saved';
  }

  $('save-key').addEventListener('click', async () => {

    const key =
      $('api-key-input').value.trim();

    if (!key) {
      localStorage.removeItem(STORAGE.apiKey);
      $('api-status').textContent = 'Cleared';
      return;
    }

    $('api-status').textContent =
      'Validating...';

    const valid = await validateApiKey(key);

    if (!valid) {
      $('api-status').innerHTML =
        '<span class="error">Invalid key</span>';
      return;
    }

    localStorage.setItem(
      STORAGE.apiKey,
      key
    );

    $('api-status').innerHTML =
      '<span class="success">Saved</span>';

  });
}

$('generate-btn')
  .addEventListener('click', generateStocks);

loadPrefs();
renderWatchlist();
renderHistory();
initApiKey();

</script>

</body>
</html>

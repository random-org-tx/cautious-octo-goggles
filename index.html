<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Stock Research</title>

<style>
body { margin:0; font-family: Inter, system-ui; background:#fafaf7; color:#111; }
.container { max-width:1100px; margin:auto; padding:20px; }
.panel { background:#fff; border:1px solid #e6e6e6; border-radius:12px; padding:18px; margin-bottom:14px; }
.controls { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
input, select { width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; }
button { padding:10px 14px; border-radius:8px; border:0; cursor:pointer; }
.primary { background:#111; color:#fff; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:10px; }
.card { border:1px solid #eee; border-radius:12px; padding:12px; background:#fff; }
.small { font-size:12px; color:#666; }
.status { font-size:13px; margin-left:10px; }
.error { color:#b42318; }
.success { color:#067647; }
.spinner { width:12px;height:12px;border:2px solid #ddd;border-top-color:#111;border-radius:50%;display:inline-block;animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>

<body>
<div class="container">

<div class="panel">
  <h2>Stock Research (Gemini Fixed)</h2>

  <input id="apiKey" placeholder="Gemini API key"/>

  <div class="controls">
    <select id="style">
      <option value="balanced">Balanced</option>
      <option value="growth">Growth</option>
      <option value="value">Value</option>
    </select>

    <select id="risk">
      <option value="moderate">Moderate</option>
      <option value="aggressive">Aggressive</option>
      <option value="conservative">Conservative</option>
    </select>

    <select id="geo">
      <option value="us">US</option>
      <option value="global">Global</option>
    </select>
  </div>

  <button class="primary" onclick="generate()">Generate</button>
  <span id="status" class="status"></span>
</div>

<div id="results"></div>

</div>

<script>

const $ = (id) => document.getElementById(id);

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function getKey(){
  return localStorage.getItem("gemini_key") || "";
}

$("#apiKey").value = getKey();

$("#apiKey").addEventListener("change", e=>{
  localStorage.setItem("gemini_key", e.target.value);
});

async function fetchWithRetry(url, options, retries=3){

  while(retries-- > 0){
    const r = await fetch(url, options);

    if(r.status === 429){
      await new Promise(res=>setTimeout(res, 3000));
      continue;
    }

    if(!r.ok){
      throw new Error(await r.text());
    }

    return r;
  }

  throw new Error("Too many retries (429)");
}

function extractJSON(text){
  try {
    return JSON.parse(text);
  } catch {}

  const start = text.indexOf("{");
  const end = text.lastIndexOf("}");

  if(start >= 0 && end > start){
    return JSON.parse(text.slice(start, end+1));
  }

  throw new Error("Invalid JSON response");
}

async function gemini(system, user){

  const key = getKey();
  if(!key) throw new Error("Missing API key");

  const useSearch = false; // IMPORTANT: keep OFF to avoid tool conflicts

  const body = {
    system_instruction: {
      parts: [{ text: system }]
    },
    contents: [{
      role:"user",
      parts:[{ text: user }]
    }],
    generationConfig: {
      temperature: 0.4,
      maxOutputTokens: 2000
    }
  };

  // SAFE MODE:
  // Do NOT combine google_search + structured JSON expectations
  if(useSearch){
    body.tools = [{ google_search: {} }];
  }

  const r = await fetchWithRetry(
    "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + encodeURIComponent(key),
    {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(body)
    }
  );

  const data = await r.json();

  const text =
    data.candidates?.[0]?.content?.parts
      ?.map(p=>p.text||"")
      .join("") || "";

  return extractJSON(text);
}

async function generate(){

  const status = $("status");
  const btn = document.querySelector("button");

  btn.disabled = true;
  status.innerHTML = `<span class="spinner"></span> generating...`;

  try{

    const prefs = {
      style: $("style").value,
      risk: $("risk").value,
      geo: $("geo").value
    };

    const system = `
You are a financial research assistant.

Return ONLY valid JSON:

{
 "marketSummary":"string",
 "picks":[
  {
    "ticker":"string",
    "company":"string",
    "sector":"string",
    "marketCap":"string",
    "peRatio":"string",
    "currentPrice":"string",
    "rationale":"string",
    "risks":"string",
    "category":"growth|value|defensive|dividend"
  }
 ]
}

Rules:
- exactly 10 picks
- no markdown
- no extra keys
`;

    const user = `
Generate 10 stock research candidates.

Style: ${prefs.style}
Risk: ${prefs.risk}
Geo: ${prefs.geo}
`;

    const res = await gemini(system, user);

    if(!res.picks) throw new Error("Bad response schema");

    $("results").innerHTML = `
      <div class="panel">
        <h3>Market Summary</h3>
        <p class="small">${esc(res.marketSummary)}</p>

        <div class="grid">
          ${res.picks.map(p=>`
            <div class="card">
              <b>${esc(p.ticker)}</b> — ${esc(p.company)}
              <div class="small">${esc(p.sector)}</div>
              <p>${esc(p.rationale)}</p>
              <div class="small">Risk: ${esc(p.risks)}</div>
            </div>
          `).join("")}
        </div>
      </div>
    `;

    status.innerHTML = `<span class="success">done</span>`;

  }catch(e){
    console.error(e);
    status.innerHTML = `<span class="error">${esc(e.message)}</span>`;
  }

  btn.disabled = false;
}

</script>
</body>
</html>

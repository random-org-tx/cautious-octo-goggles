<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stock Research (Offline + Auto Dataset)</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#fafaf7;
  color:#1a1a1a;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
}

.container{
  max-width:1100px;
  margin:0 auto;
  padding:24px 20px 60px;
}

.header h1{margin:0;font-size:26px}
.header p{color:#666;font-size:14px}

.panel{
  background:white;
  border:1px solid rgba(0,0,0,0.08);
  border-radius:14px;
  padding:20px;
  margin-bottom:16px;
}

.controls{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
}

.control label{font-size:12px;color:#666}
.control select{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid rgba(0,0,0,0.15);
}

button{
  border:none;
  border-radius:8px;
  padding:10px 16px;
  cursor:pointer;
  font-weight:600;
}

.primary{background:#111;color:#fff}

.status{font-size:13px;color:#666;margin-left:10px}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:12px;
}

.card{
  border:1px solid rgba(0,0,0,0.08);
  border-radius:12px;
  padding:14px;
  background:white;
}

.ticker{font-size:18px;font-weight:700}
.company{font-size:13px;color:#666}

.badge{
  display:inline-block;
  padding:4px 8px;
  background:#f2f2f0;
  border-radius:999px;
  font-size:11px;
  margin-top:6px;
}

.metric{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  padding:4px 0;
}

.rationale{
  margin-top:10px;
  font-size:13px;
  line-height:1.5;
  color:#444;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Stock Research (Auto-Updating)</h1>
    <p>GitHub Actions dataset + offline scoring engine</p>
  </div>

  <div class="panel">

    <div class="controls">

      <div class="control">
        <label>Style</label>
        <select id="style">
          <option value="balanced">Balanced</option>
          <option value="value">Value</option>
          <option value="growth">Growth</option>
        </select>
      </div>

      <div class="control">
        <label>Risk</label>
        <select id="risk">
          <option value="moderate">Moderate</option>
          <option value="conservative">Conservative</option>
          <option value="aggressive">Aggressive</option>
        </select>
      </div>

    </div>

    <div style="margin-top:12px;">
      <button class="primary" onclick="generateStocks()">
        Generate 10 Picks
      </button>
      <span class="status" id="status"></span>
    </div>

  </div>

  <div id="results"></div>

</div>

<script>

/* -----------------------------
   1. LIVE DATA LOADER
------------------------------*/

let STOCKS = [];

async function loadData() {
  try {
    const res = await fetch("./data/stocks.json?v=" + Date.now());

    if (!res.ok) {
      throw new Error("Dataset not found. Run GitHub Action first.");
    }

    STOCKS = await res.json();

  } catch (e) {
    document.getElementById("status").textContent =
      "Failed to load dataset";
    console.error(e);
  }
}

/* -----------------------------
   2. LOCAL SCORING ENGINE
------------------------------*/

function score(stock, prefs){

  let s = 0;
  const pe = stock.pe || 1000;

  if(prefs.style === "value"){
    s += (1 / pe) * 100;
  }

  if(prefs.style === "growth"){
    s += (stock.mcap || 1) / 100;
  }

  if(prefs.style === "balanced"){
    s += (1 / pe) * 50 + (stock.mcap || 1) / 200;
  }

  if(prefs.risk === "conservative"){
    s += (stock.mcap || 1) > 2000 ? 20 : 5;
  }

  return s;
}

/* -----------------------------
   3. RANKING
------------------------------*/

function rankStocks(prefs){

  return STOCKS
    .map(s => ({
      ...s,
      score: score(s, prefs)
    }))
    .sort((a,b)=>b.score-a.score)
    .slice(0,10);
}

/* -----------------------------
   4. RENDER UI
------------------------------*/

function render(stocks){

  document.getElementById("results").innerHTML = `
    <div class="panel">
      <h2>Top 10 Picks</h2>

      <div class="grid">
        ${stocks.map(s=>`
          <div class="card">
            <div class="ticker">${s.ticker}</div>
            <div class="company">${s.company || ""}</div>

            <div class="badge">${s.sector || "Unknown"}</div>

            <div class="metric">
              <span>Price</span><span>${s.price || "N/A"}</span>
            </div>

            <div class="metric">
              <span>P/E</span><span>${s.pe || "N/A"}</span>
            </div>

            <div class="metric">
              <span>Market Cap</span><span>${s.mcap || "N/A"}</span>
            </div>

            <div class="rationale">
              Score: ${s.score.toFixed(2)} — ranked using local deterministic model.
            </div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

/* -----------------------------
   5. MAIN ENTRY
------------------------------*/

async function generateStocks(){

  document.getElementById("status").textContent =
    "Loading dataset...";

  await loadData();

  if(!STOCKS.length){
    document.getElementById("status").textContent =
      "No dataset available";
    return;
  }

  const prefs = {
    style: document.getElementById("style").value,
    risk: document.getElementById("risk").value
  };

  const ranked = rankStocks(prefs);

  render(ranked);

  document.getElementById("status").textContent =
    "Loaded from GitHub Actions dataset";
}

</script>

</body>
</html>

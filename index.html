<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Stock Research (Offline)</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#fafaf7;
  color:#1a1a1a;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
}

.container{
  max-width:1100px;
  margin:0 auto;
  padding:24px 20px 60px;
}

.header h1{margin:0;font-size:26px}
.header p{color:#666;font-size:14px}

.panel{
  background:white;
  border:1px solid rgba(0,0,0,0.08);
  border-radius:14px;
  padding:20px;
  margin-bottom:16px;
}

.controls{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
}

.control label{font-size:12px;color:#666}
.control select,.control input{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid rgba(0,0,0,0.15);
}

button{
  border:none;
  border-radius:8px;
  padding:10px 16px;
  cursor:pointer;
  font-weight:600;
}

.primary{background:#111;color:#fff}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:12px;
}

.card{
  border:1px solid rgba(0,0,0,0.08);
  border-radius:12px;
  padding:14px;
  background:white;
}

.ticker{font-size:18px;font-weight:700}
.company{font-size:13px;color:#666}

.badge{
  display:inline-block;
  padding:4px 8px;
  background:#f2f2f0;
  border-radius:999px;
  font-size:11px;
  margin-right:5px;
}

.metric{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  padding:4px 0;
}

.rationale{
  margin-top:10px;
  font-size:13px;
  line-height:1.5;
}

.status{font-size:13px;color:#666;margin-left:10px}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Stock Research (Offline Mode)</h1>
    <p>No APIs • No keys • Fully deterministic local analysis</p>
  </div>

  <div class="panel">

    <div class="controls">

      <div class="control">
        <label>Style</label>
        <select id="style">
          <option value="balanced">Balanced</option>
          <option value="value">Value</option>
          <option value="growth">Growth</option>
          <option value="dividend">Dividend</option>
        </select>
      </div>

      <div class="control">
        <label>Risk</label>
        <select id="risk">
          <option value="moderate">Moderate</option>
          <option value="conservative">Conservative</option>
          <option value="aggressive">Aggressive</option>
        </select>
      </div>

    </div>

    <div style="margin-top:12px;">
      <button class="primary" onclick="generateStocks()">
        Generate 10 Picks
      </button>
      <span class="status" id="status"></span>
    </div>

  </div>

  <div id="results"></div>

</div>

<script>

/* -----------------------------
   1. STATIC DATASET (NO API)
------------------------------*/

const STOCKS = [
  {ticker:"AAPL", company:"Apple", sector:"Tech", price:180, pe:28, mcap:2800},
  {ticker:"MSFT", company:"Microsoft", sector:"Tech", price:420, pe:32, mcap:3100},
  {ticker:"GOOGL", company:"Alphabet", sector:"Tech", price:140, pe:25, mcap:1700},
  {ticker:"AMZN", company:"Amazon", sector:"Consumer", price:170, pe:60, mcap:1800},
  {ticker:"NVDA", company:"NVIDIA", sector:"AI", price:900, pe:70, mcap:2200},
  {ticker:"META", company:"Meta", sector:"Social", price:480, pe:22, mcap:1200},
  {ticker:"TSLA", company:"Tesla", sector:"Auto", price:220, pe:45, mcap:700}
];

/* -----------------------------
   2. SCORING ENGINE (LOCAL AI)
------------------------------*/

function score(stock, prefs){

  let s = 0;
  const pe = stock.pe || 1000;

  if(prefs.style === "value"){
    s += (1/pe)*100;
  }

  if(prefs.style === "growth"){
    s += stock.mcap > 2000 ? 30 : 10;
  }

  if(prefs.risk === "conservative"){
    s += stock.mcap > 2000 ? 20 : 5;
  }

  if(prefs.style === "balanced"){
    s += 10 / pe;
    s += stock.mcap / 1000;
  }

  return s;
}

/* -----------------------------
   3. RANKING ENGINE
------------------------------*/

function rankStocks(prefs){

  return STOCKS
    .map(s => ({
      ...s,
      score: score(s, prefs)
    }))
    .sort((a,b)=>b.score-a.score)
    .slice(0,10);
}

/* -----------------------------
   4. RENDER UI
------------------------------*/

function render(stocks){

  document.getElementById("results").innerHTML = `
    <div class="panel">
      <h2>Top 10 Picks (Local Model)</h2>

      <div class="grid">
        ${stocks.map(s=>`
          <div class="card">
            <div class="ticker">${s.ticker}</div>
            <div class="company">${s.company}</div>

            <div style="margin-top:8px;">
              <span class="badge">${s.sector}</span>
            </div>

            <div class="metric"><span>Price</span><span>$${s.price}</span></div>
            <div class="metric"><span>P/E</span><span>${s.pe}</span></div>
            <div class="metric"><span>Market Cap</span><span>${s.mcap}B</span></div>

            <div class="rationale">
              Score: ${s.score.toFixed(2)} — ranked by local deterministic model.
            </div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

/* -----------------------------
   5. MAIN ENTRY
------------------------------*/

function generateStocks(){

  const prefs = {
    style: document.getElementById("style").value,
    risk: document.getElementById("risk").value
  };

  const ranked = rankStocks(prefs);

  render(ranked);

  document.getElementById("status").textContent =
    "Generated locally (no API calls)";
}

</script>

</body>
</html>
